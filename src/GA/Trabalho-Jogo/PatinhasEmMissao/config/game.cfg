# Patinhas em Missao - configuracao carregada na inicializacao.
# Altere os valores, salve e reabra o jogo.
# Janela: largura 640..3840; altura 360..2160. Mundo virtual: 1280x720.
window_width = 1280
window_height = 720
lives = 3

# Velocidades em unidades virtuais por segundo.
# start_speed: 180..430; max_speed: start_speed..600; acceleration: 0..5.
start_speed = 310
max_speed = 560
acceleration = 2

# gravity: 1200..2600; jump_speed: 600..950.
# jump_speed^2 / (2*gravity) precisa ser >=105 para transpor os obstaculos.
gravity = 1700
jump_speed = 780
animation_fps = 10
invulnerability = 1.35

# Caminhos relativos a raiz do projeto. Spritesheets: 4 colunas x 2 linhas.
dog_texture = assets/dog.png
items_texture = assets/items.png
sky_texture = assets/sky.png
hills_texture = assets/hills.png
trees_texture = assets/trees.png
ground_texture = assets/ground.png
